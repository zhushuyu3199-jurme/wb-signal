name: Portfolio Monitor

on:
  schedule:
    # 北京时间 12:00 = UTC 04:00
    - cron: "0 4 * * 1-5"
    # 北京时间 22:00 = UTC 14:00
    - cron: "0 14 * * 1-5"
  workflow_dispatch:
    inputs:
      force:
        description: "强制运行（忽略周末休市，手动测试用）"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: monitor
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 运行组合监测
        env:
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
        run: python run_daily.py --mode auto ${{ github.event_name == 'workflow_dispatch' && '--force' || '' }}

      - name: 回写数据（分红库/净值库/手动值）
        run: |
          git config user.name "monitor-bot"
          git config user.email "monitor-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "无变化"
          else
            git commit -m "data update: $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
