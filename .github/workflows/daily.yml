name: Daily Signal Report

on:
  # 每日定时运行：UTC 14:00 = 北京时间 22:00
  # 如需改时间：换算成 UTC 后修改下面的 cron（例：北京时间 08:00 = UTC 00:00 => "0 0 * * *"）
  schedule:
    - cron: "0 14 * * *"
  # 允许在 Actions 页面手动触发（首次验证用）
  workflow_dispatch:

permissions:
  contents: write   # 允许把更新后的数据提交回仓库

concurrency:
  group: daily
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 取回仓库
        uses: actions/checkout@v4

      - name: 准备 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 运行信号日报
        env:
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
        run: python combo_daily.py

      - name: 提交数据更新
        run: |
          git config user.name "signal-bot"
          git config user.email "signal-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "无数据变化，跳过提交"
          else
            git commit -m "data update: $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
